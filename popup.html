<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Kimi Auto Paste & Retry</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 220px;
      padding: 14px;
      text-align: center;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2f6fed;
      color: white;
    }
    button.active {
      background: #d9363e;
    }
    .field {
      margin-top: 12px;
      font-size: 12px;
      color: #333;
      text-align: left;
    }
    .field input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 6px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 6px;
    }
    .hint {
      font-size: 11px;
      color: #777;
      margin-top: 3px;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Kimi Auto Paste & Retry</h1>
  <button id="toggle">Ativar</button>
  <label class="field">Pausa entre ações (segundos)
    <input type="number" id="delay" min="1" step="1" value="5" />
  </label>
  <label class="field">Máx. de tentativas
    <input type="number" id="max" min="0" step="1" value="100" />
    <div class="hint">0 = sem limite</div>
  </label>
  <p id="status">Desativado</p>
  <p class="hint" id="version"></p>
  <script src="popup.js"></script>
</body>
</html>
