<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Kimi Auto Paste & Retry</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 220px;
      padding: 14px;
      text-align: center;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: none;
      border-radius: 6px;

    }
    button.active {

    }

      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Kimi Auto Paste & Retry</h1>
  <button id="toggle">Ativar</button>
  <p id="status">Desativado</p>
  <script src="popup.js"></script>
</body>
</html>
